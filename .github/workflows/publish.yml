name: Publish to PyPI

on:
  push:
    tags:
      - "v*.*.*"

permissions: read-all

jobs:
  ci:
    name: Quality gate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      # Same locked install as ci.yml: hashed wheels from requirements/dev.txt.
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Lint
        run: |
          ruff check src/ tests/ infra/
          ruff format --check src/ tests/ infra/

      - name: Type check
        run: mypy src/envault/

      - name: Test
        run: pytest tests/unit/ -v
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1

      - name: Audit dependencies
        run: |
          # The locked development/CI environment (pip-audit itself is locked).
          pip-audit
          # The CDK toolchain lock. GHSA-464c-974j-9xm6: aws-cdk-lib < 2.253.0
          # inverts the encrypted flag of aws-codebuild S3LoggingOptions; the
          # envault stack defines no CodeBuild project. Drop this once
          # aws-cdk-lib is >= 2.253.0.
          pip-audit --disable-pip --require-hashes --ignore-vuln GHSA-464c-974j-9xm6 \
            -r infra/cdk/requirements-ci.txt

  build:
    name: Build distribution
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Validate tag matches package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag version ($TAG_VERSION) does not match pyproject.toml version ($PKG_VERSION)"
            exit 1
          fi

      # build, hatchling and editables come from the hashed lock, and the build
      # runs without an isolated environment so that it uses exactly those
      # versions instead of whatever PyPI serves at release time.
      - name: Install build tools (locked)
        run: |
          python -m pip install --require-hashes --only-binary :all: -r requirements/dev.txt
          python -m pip check

      - name: Build wheel and sdist
        run: python -m build --no-isolation

      - name: Upload distribution artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/envault-cli
    permissions:
      id-token: write  # Required for Trusted Publishers (OIDC)
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
