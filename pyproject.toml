[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "envault-cli"
version = "0.2.0"
description = "Client-side envelope encryption for files using AWS KMS, with DynamoDB state tracking"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
keywords = ["aws", "kms", "encryption", "s3", "dynamodb", "envelope-encryption"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security :: Cryptography",
]
dependencies = [
    "aws-encryption-sdk>=3.1.1,<5",
    # >=1.35.2: uploads send PutObject IfNoneMatch="*" (never overwrite a key a
    # record pins), and botocore 1.35.2 is the first release whose S3 model has
    # it. boto3 1.35.2 requires botocore>=1.35.2,<1.36.
    "boto3>=1.35.2,<2",
    "click>=8.1.0,<9",
    "rich>=13.0.0,<16",
    "tenacity>=8.2.0,<10",
    # >=3 required: cli.py imports pythonjsonlogger.json (moved in 3.0)
    "python-json-logger>=3.0.0,<5",
]

[project.optional-dependencies]
# CI and development install the exact versions locked in requirements/dev.txt
# (hashed, valid for Python 3.10-3.12), not these ranges. After changing any
# dependency here or in [project], regenerate the lock from the repository root:
#
#   uv pip compile pyproject.toml --extra dev --universal --python-version 3.10 --generate-hashes --output-file requirements/dev.txt
#
# Add --upgrade to move every package to the newest version the ranges allow.
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=4.0.0,<8",
    "moto[dynamodb,s3,kms]>=4.2.0,<6",
    "ruff>=0.1.0,<1",
    "mypy>=1.5.0,<3",
    "boto3-stubs[dynamodb,s3,kms]>=1.35.2,<2",
    # CI tooling, locked with everything else: dependency audit, and the
    # build frontend/backend used to build the release (with --no-isolation).
    "pip-audit>=2.10.0,<3",
    "build>=1.3.0,<2",
    "hatchling>=1.27.0,<2",
    # hatchling's editable-install hook needs editables; CI installs the
    # package with --no-build-isolation so that it builds with the locked tools.
    "editables>=0.3,<1",
]

[project.scripts]
envault = "envault.cli:cli"

[project.urls]
Homepage = "https://github.com/Specter099/envault-cli"
Repository = "https://github.com/Specter099/envault-cli"
Issues = "https://github.com/Specter099/envault-cli/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/envault"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S"]
ignore = ["S101"]  # allow assert in tests

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=envault --cov-report=term-missing"

[tool.coverage.run]
source = ["src/envault"]
