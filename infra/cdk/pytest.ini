# CDK assertion tests for EnvaultStack. Run from infra/cdk/ with the CDK
# dependencies installed (requirements-ci.txt):
#
#   python -m pytest
#
# This file makes infra/cdk/ the pytest rootdir for these tests, so the
# package's settings in the top-level pyproject.toml (coverage of envault)
# do not apply here, and `pytest tests/unit` never collects this tree.
[pytest]
testpaths = tests
pythonpath = .
addopts = -ra --strict-markers
